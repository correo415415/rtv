# Compila rtv para Windows, Linux y macOS con FFmpeg 7.1 EMPAQUETADO dentro
# de cada artefacto: el usuario final NO necesita instalar FFmpeg.
#
# Por qué FFmpeg 7.1 exactamente: ffmpeg-the-third 5.0 usa AVCodecID V410/V308
# (solo existen desde 7.1) y campos legacy de AVCodec eliminados en 8.0
# (ver BUILD-WINDOWS.md). 7.1.x es la única rama que compila.
#
# Estrategia por SO (todo validado):
#   * Linux (x86_64 + arm64): FFmpeg 7.1.5 compilado desde fuente (config
#     mínima LGPL: solo decode, + dav1d para AV1 y VAAPI para hwdec) y
#     cacheado. NO se usan los builds BtbN aquí: sus .so llevan stubs
#     implib-gen que hacen dlopen perezoso de libva/libvdpau/etc. y ABORTAN
#     con assert si la lib no está instalada — rtv crasheaba al sondear
#     --hwdec auto en cualquier máquina sin libva (visto en CI). Con el
#     build propio libva va enlazada dinámicamente Y empaquetada: si en la
#     máquina del usuario no hay driver VAAPI, av_hwdevice_ctx_create falla
#     LIMPIO y rtv cae a software. Se empaqueta el cierre completo de deps
#     no-sistema con RPATH $ORIGIN (patchelf); requisitos del usuario:
#     glibc >= 2.35 (Ubuntu 22.04+) y libasound2.
#   * Windows (x86_64): BtbN "win64-lgpl-shared" (equivalente al winget
#     BtbN.FFmpeg.*.Shared.7.1 que usa BUILD-WINDOWS.md). FFMPEG_DIR + las
#     5 DLLs copiadas junto a rtv.exe (Windows resuelve DLLs del dir del exe).
#   * macOS (x86_64 + arm64): no hay BtbN para macOS -> se compila FFmpeg
#     7.1.5 desde fuente (config mínima LGPL: solo decode, sin
#     avfilter/avdevice/encoders, + dav1d para AV1 y VideoToolbox para hwdec),
#     se cachea, y se empaquetan las dylibs con dylibbundler
#     (@executable_path/libs) + re-firma ad-hoc (obligatoria en arm64).
#     Runners: macos-15-intel (macos-13 fue retirado en dic 2025) y macos-14.
#   * Termux/Android (x86_64 + aarch64): build y tests DENTRO de contenedores
#     termux/termux-docker (userland Termux real, sin dispositivo físico) con
#     scripts/build-termux.sh — el mismo script que ejecuta un usuario en su
#     móvil. Incluye test de AUDIO real contra PulseAudio con null-sink.

name: build

# Disparadores: SOLO manual (Actions -> build -> Run workflow) y tags v*
# (crear una release es un acto deliberado, no "subir un commit").
# A propósito NO se ejecuta en pushes a main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Crear una GitHub Release con este tag (p.ej. v0.5.0). Vacío = solo artefactos, sin release."
        type: string
        default: ""
      release_message:
        description: "Mensaje de la release (Markdown soportado: **negrita**, listas, enlaces…). Va encima de la tabla de descargas."
        type: string
        default: ""
      prerelease:
        description: "Marcar la release como pre-release"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # Rama de BtbN/FFmpeg-Builds para Windows (release "latest").
  FF_BRANCH: "7.1"
  # Tarball fuente para Linux y macOS (último 7.1.x publicado).
  FF_SRC_VERSION: "7.1.5"

jobs:
  # ---------------------------------------------------------------- Linux --
  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04       # glibc 2.35 -> compatible hacia delante
            arch: x86_64
          - runner: ubuntu-22.04-arm   # runners ARM gratis en repos públicos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          # ffmpeg (el CLI de apt) es solo para generar el vídeo del smoke
          # test; nasm para el asm x86 de FFmpeg; dav1d/va/drm se enlazan
          # dinámicamente y se empaquetan en el artefacto.
          # libgnutls28-dev: TLS para el protocolo https de libavformat
          # (reproducción por red). GnuTLS es LGPLv2.1+ — mantiene la
          # licencia "LGPL 2.1 or later" del build (openssl/mbedtls
          # exigirían --enable-version3).
          # pulseaudio(+utils): servidor real con null-sink para el test
          # de doble input (no hay hardware de audio en el runner).
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config patchelf clang libclang-dev nasm \
            libdav1d-dev libva-dev libdrm-dev libgnutls28-dev ffmpeg \
            pulseaudio pulseaudio-utils

      - name: Cache de FFmpeg compilado
        id: ffcache
        uses: actions/cache@v6
        with:
          path: ~/ffmpeg
          key: ffmpeg-${{ env.FF_SRC_VERSION }}-dav1d-vaapi-gnutls-${{ matrix.runner }}-v1

      - name: Compilar FFmpeg ${{ env.FF_SRC_VERSION }} desde fuente (LGPL mínimo)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Espejo de GitHub primario (ffmpeg.org resetea conexiones desde
          # runners); fallback al tarball oficial.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/ffmpeg-src.tar \
            "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n${FF_SRC_VERSION}.tar.gz" || \
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/ffmpeg-src.tar \
            "https://ffmpeg.org/releases/ffmpeg-${FF_SRC_VERSION}.tar.xz"
          mkdir -p /tmp/ffmpeg-src
          tar -xf /tmp/ffmpeg-src.tar -C /tmp/ffmpeg-src --strip-components=1
          cd /tmp/ffmpeg-src
          # Config mínima para rtv: solo DECODE. Sin avfilter/avdevice ni
          # encoders/muxers. dav1d = AV1 decente; vaapi = hwdec (enlazado
          # dinámico normal, SIN los stubs dlopen+assert de BtbN).
          # --disable-xlib/libxcb: VAAPI solo por DRM render nodes (el camino
          # moderno) -> no se arrastra libX11 y familia al paquete.
          # Verificado en local: configure OK con CONFIG_VAAPI=1 y
          # CONFIG_LIBDAV1D=1, licencia "LGPL version 2.1 or later".
          # gnutls = https (reproducción por red); network va enabled
          # por defecto (http/tcp/hls…), solo falta la capa TLS.
          ./configure --prefix="$HOME/ffmpeg" \
            --enable-shared --disable-static \
            --disable-programs --disable-doc \
            --disable-avdevice --disable-avfilter \
            --disable-encoders --disable-muxers \
            --disable-xlib --disable-libxcb \
            --enable-libdav1d --enable-vaapi \
            --enable-gnutls
          # Si https no quedó compilado, mejor reventar aquí que publicar
          # un paquete sin reproducción por red.
          grep -q "CONFIG_HTTPS_PROTOCOL 1" config_components.h
          make -j"$(nproc)"
          make install
          cp COPYING.LGPLv2.1 "$HOME/ffmpeg/LICENSE.txt"

      - name: Compilar
        run: |
          echo "FFMPEG_DIR=$HOME/ffmpeg" >> "$GITHUB_ENV"
          export FFMPEG_DIR="$HOME/ffmpeg"
          cargo build --release --locked

      - name: Tests unitarios
        env:
          LD_LIBRARY_PATH: ${{ env.FFMPEG_DIR }}/lib
        run: cargo test --release --locked

      - name: Empaquetar (binario + cierre de libs no-sistema, RPATH $ORIGIN)
        id: pkg
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then ver="$GITHUB_REF_NAME"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then ver="${{ inputs.release_tag }}"
          else ver="${GITHUB_SHA::7}"; fi
          pkg="rtv-${ver}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$pkg/lib"
          cp target/release/rtv "dist/$pkg/"
          # Cierre transitivo de dependencias NO-sistema (ffmpeg + dav1d +
          # libva...): todo lo que ldd resuelva salvo la familia glibc,
          # libgcc y libasound (ésa es del sistema por diseño: sus plugins
          # ALSA no son empaquetables).
          sysre='linux-vdso|ld-linux|libc\.so|libm\.so|libdl\.so|libpthread\.so|librt\.so|libgcc_s|libmvec|libasound'
          count=0
          while read -r name path; do
            [[ "$name" =~ $sysre ]] && continue
            cp -L "$path" "dist/$pkg/lib/"
            count=$((count+1))
          done < <(LD_LIBRARY_PATH="$FFMPEG_DIR/lib" ldd target/release/rtv | awk '/=>/ {print $1, $3}')
          echo "libs empaquetadas: $count"; ls "dist/$pkg/lib/"
          test "$count" -ge 5   # sanity: al menos las 5 de ffmpeg
          # https: la cadena gnutls (nettle/hogweed/gmp…) tiene que venir
          # en el cierre — sin ella el paquete no reproduce por red TLS.
          ls "dist/$pkg/lib/"libgnutls*
          # RPATH: $ORIGIN/lib en el binario; $ORIGIN en cada lib para que
          # resuelvan a sus hermanas del mismo dir (p.ej. avutil -> libva).
          patchelf --set-rpath '$ORIGIN/lib' "dist/$pkg/rtv"
          for so in "dist/$pkg/lib/"*; do patchelf --set-rpath '$ORIGIN' "$so"; done
          cp "$FFMPEG_DIR/LICENSE.txt" "dist/$pkg/LICENSE-ffmpeg.txt"
          cp README.md "dist/$pkg/"
          # yt-dlp standalone oficial (para URLs de YouTube y demás).
          # rtv prefiere el del PATH del usuario si existe; éste es el
          # fallback "funciona nada más descomprimir". Soporta
          # self-update (yt-dlp -U), así que no queda congelado.
          case "${{ matrix.arch }}" in
            x86_64) ytdlp_asset=yt-dlp_linux ;;
            arm64)  ytdlp_asset=yt-dlp_linux_aarch64 ;;
          esac
          curl -fsSL --retry 5 --retry-all-errors -o "dist/$pkg/yt-dlp" \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/$ytdlp_asset"
          chmod +x "dist/$pkg/yt-dlp"
          "dist/$pkg/yt-dlp" --version   # sanity: arranca en esta arch
          cp ci/LICENSE-yt-dlp.txt "dist/$pkg/"
          tar -C dist -czf "$pkg.tar.gz" "$pkg"
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"

      - name: Smoke test (paquete relocable, sin FFmpeg del sistema)
        run: |
          set -euo pipefail
          pkg="${{ steps.pkg.outputs.pkg }}"
          # Copiar el paquete a otra ruta para probar la relocabilidad real.
          cp -r "dist/$pkg" /tmp/smoke-pkg
          # Las libs deben resolverse DENTRO del paquete, nada "not found".
          ldd /tmp/smoke-pkg/rtv | tee /tmp/ldd.txt
          ! grep -q "not found" /tmp/ldd.txt
          grep -E "libav|libsw" /tmp/ldd.txt | grep -qv "/tmp/smoke-pkg/lib" && exit 1 || true
          /tmp/smoke-pkg/rtv --version
          # Vídeo de prueba con el ffmpeg CLI de apt (solo fixture de test).
          ffmpeg -y -f lavfi -i testsrc2=size=320x180:rate=30 -t 2 \
            -c:v mpeg4 -an /tmp/smoke.mp4
          # Harness pty propio (winsize fijo + drenaje continuo + volcado de
          # diagnóstico si falla): el `script` de util-linux 2.37 del runner
          # maneja mal el stdin no-TTY y el hijo moría con SIGABRT (exit 134).
          python3 ci/smoke_pty.py /tmp/smoke-pkg/rtv /tmp/smoke.mp4

      - name: Smoke test de RED (http local, --info + reproducción)
        run: |
          set -euo pipefail
          # Servidor http local sirviendo el fixture: valida la pila de
          # red de libavformat de punta a punta (open → demux → decode
          # → render) sin depender de hosts externos. La capa TLS ya
          # quedó verificada en config.h + libgnutls empaquetada.
          python3 -m http.server 8123 --bind 127.0.0.1 --directory /tmp &
          srv=$!; trap 'kill $srv' EXIT
          sleep 1
          /tmp/smoke-pkg/rtv --info http://127.0.0.1:8123/smoke.mp4
          python3 ci/smoke_pty.py /tmp/smoke-pkg/rtv http://127.0.0.1:8123/smoke.mp4

      - name: Test de DOBLE INPUT (vídeo y audio en URLs separadas)
        run: |
          set -euo pipefail
          # El escenario DASH de YouTube reproducido en local: un input
          # SOLO-vídeo y otro SOLO-audio servidos por http. PulseAudio
          # real con null-sink (misma receta que el job termux) y el
          # checker que exige que el reloj de audio ancle y avance —
          # valida demux dual + sincronía, no solo "no crashea".
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_sink
          ffmpeg -y -loglevel error -f lavfi -i testsrc2=size=320x180:rate=30 \
            -t 6 -c:v mpeg4 -an -movflags +faststart /tmp/dual_v.mp4
          ffmpeg -y -loglevel error -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 6 -c:a aac -movflags +faststart /tmp/dual_a.m4a
          python3 -m http.server 8124 --bind 127.0.0.1 --directory /tmp &
          srv=$!; trap 'kill $srv' EXIT
          sleep 1
          # --info también debe sondear el input de audio separado.
          /tmp/smoke-pkg/rtv --info http://127.0.0.1:8124/dual_v.mp4 \
            --audio-file http://127.0.0.1:8124/dual_a.m4a | tee /tmp/dualinfo.txt
          grep -q "input separado" /tmp/dualinfo.txt
          grep -q "aac" /tmp/dualinfo.txt
          python3 ci/termux_audio_check.py /tmp/smoke-pkg/rtv \
            http://127.0.0.1:8124/dual_v.mp4 \
            --audio-file http://127.0.0.1:8124/dual_a.m4a --audio-backend pulse

      - name: Test de AUTO-ROTACIÓN (Display Matrix)
        run: |
          set -euo pipefail
          # Vídeo "de móvil": apaisado 320x180 + Display Matrix de 90°.
          # rtv debe presentarlo VERTICAL (180x320): --info lo verifica
          # sin PTY, y el test de integración comprueba los PÍXELES de
          # la salida (mitades roja/azul en el lado correcto tras rotar).
          python3 tests/integration_rotation.py /tmp/smoke-pkg/rtv

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.pkg }}
          path: ${{ steps.pkg.outputs.pkg }}.tar.gz
          if-no-files-found: error

  # -------------------------------------------------------------- Windows --
  windows:
    name: windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # https en Windows: los builds BtbN compilan con --enable-schannel
      # (TLS nativo del sistema, verificado en BtbN/FFmpeg-Builds
      # scripts.d/50-schannel.sh) — la reproducción por red funciona sin
      # empaquetar nada extra.
      - name: Descargar FFmpeg ${{ env.FF_BRANCH }} shared (BtbN)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n$env:FF_BRANCH-latest-win64-lgpl-shared-$env:FF_BRANCH.zip"
          Invoke-WebRequest -Uri $url -OutFile C:\ffmpeg.zip
          Expand-Archive C:\ffmpeg.zip -DestinationPath C:\ffdl
          $inner = Get-ChildItem C:\ffdl -Directory | Select-Object -First 1
          Move-Item $inner.FullName C:\ffmpeg
          "FFMPEG_DIR=C:\ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # El LLVM 20.1.8 preinstalado en windows-latest crashea (STATUS_ACCESS_
      # VIOLATION en el build script de ffmpeg-sys-the-third): clang-sys 1.8.1
      # (fijado por el Cargo.lock) soporta libclang hasta la 18 -> LLVM 18.
      # Descarga directa del release oficial (antes se usaba KyleMayes/
      # install-llvm-action, pero sigue en Node 20 -> warning de deprecacion).
      # Solo hace falta libclang.dll + los headers builtin de clang, que se
      # extraen selectivamente del instalador NSIS con 7z (preinstalado).
      - name: Instalar LLVM 18 (libclang compatible con clang-sys 1.8)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/LLVM-18.1.8-win64.exe"
          curl.exe -fsSL --retry 5 --retry-all-errors -o C:\llvm18.exe $url
          # Extraer solo lo que necesita clang-sys/bindgen (dir limpio: el
          # default C:\Program Files\LLVM mezclaria con el LLVM 20 del runner).
          7z x C:\llvm18.exe -oC:\llvm18 "bin\libclang.dll" "lib\clang" | Out-Null
          if (-not (Test-Path C:\llvm18\bin\libclang.dll)) { throw "falta libclang.dll" }
          "LIBCLANG_PATH=C:\llvm18\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compilar
        run: cargo build --release --locked

      - name: Empaquetar (rtv.exe + DLLs de FFmpeg)
        id: pkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -like "refs/tags/*") { $ver = $env:GITHUB_REF_NAME }
          elseif ("${{ inputs.release_tag }}" -ne "") { $ver = "${{ inputs.release_tag }}" }
          else { $ver = $env:GITHUB_SHA.Substring(0,7) }
          $pkg = "rtv-$ver-windows-x86_64"
          New-Item -ItemType Directory -Path "dist\$pkg" | Out-Null
          Copy-Item target\release\rtv.exe "dist\$pkg\"
          # Solo las 5 familias que rtv enlaza (sin avfilter/avdevice).
          foreach ($fam in "avutil","avcodec","avformat","swscale","swresample") {
            $dll = Get-ChildItem "C:\ffmpeg\bin\$fam-*.dll"
            if (-not $dll) { throw "falta $fam-*.dll" }
            Copy-Item $dll.FullName "dist\$pkg\"
          }
          Copy-Item C:\ffmpeg\LICENSE.txt "dist\$pkg\LICENSE-ffmpeg.txt"
          Copy-Item README.md "dist\$pkg\"
          # yt-dlp.exe standalone oficial: fallback si el usuario no
          # tiene uno en el PATH (rtv prefiere el del PATH). Con
          # self-update (yt-dlp -U) no queda congelado.
          curl.exe -fsSL --retry 5 --retry-all-errors -o "dist\$pkg\yt-dlp.exe" `
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          & "dist\$pkg\yt-dlp.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "yt-dlp.exe no arranca" }
          Copy-Item ci\LICENSE-yt-dlp.txt "dist\$pkg\"
          Compress-Archive -Path "dist\$pkg" -DestinationPath "$pkg.zip"
          "pkg=$pkg" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Smoke test (DLLs resueltas desde el dir del exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = "${{ steps.pkg.outputs.pkg }}"
          # Copiar a otra ruta SIN C:\ffmpeg en el PATH: si --version arranca,
          # el loader resolvió las DLLs desde el propio directorio del paquete.
          Copy-Item -Recurse "dist\$pkg" "$env:TEMP\smoke-pkg"
          $env:Path = ($env:Path -split ";" | Where-Object { $_ -notlike "*ffmpeg*" }) -join ";"
          & "$env:TEMP\smoke-pkg\rtv.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "smoke test falló" }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.pkg }}
          path: ${{ steps.pkg.outputs.pkg }}.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- macOS --
  macos:
    name: macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel   # último runner Intel disponible
            arch: x86_64
          - runner: macos-14         # Apple Silicon
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dependencias (brew)
        run: brew install nasm dav1d dylibbundler pkgconf

      - name: Cache de FFmpeg compilado
        id: ffcache
        uses: actions/cache@v6
        with:
          path: ~/ffmpeg
          key: ffmpeg-${{ env.FF_SRC_VERSION }}-dav1d-sectransport-${{ matrix.runner }}-v1

      - name: Compilar FFmpeg ${{ env.FF_SRC_VERSION }} desde fuente (LGPL mínimo)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Espejo de GitHub como primario: ffmpeg.org resetea conexiones
          # desde los runners (curl 35). Fallback a ffmpeg.org por si acaso.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/ffmpeg-src.tar \
            "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n${FF_SRC_VERSION}.tar.gz" || \
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/ffmpeg-src.tar \
            "https://ffmpeg.org/releases/ffmpeg-${FF_SRC_VERSION}.tar.xz"
          mkdir -p /tmp/ffmpeg-src
          tar -xf /tmp/ffmpeg-src.tar -C /tmp/ffmpeg-src --strip-components=1
          cd /tmp/ffmpeg-src
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          # Config mínima para rtv: solo DECODE. Sin avfilter/avdevice (la
          # crate no los usa), sin encoders/muxers. dav1d = AV1 por software
          # decente; VideoToolbox = hwdec (--hwdec auto de rtv).
          # SecureTransport = https con el TLS del sistema (framework
          # Security de macOS): nada extra que empaquetar. Explícito
          # para que configure falle ruidosamente si no está.
          ./configure --prefix="$HOME/ffmpeg" \
            --enable-shared --disable-static \
            --disable-programs --disable-doc \
            --disable-avdevice --disable-avfilter \
            --disable-encoders --disable-muxers \
            --enable-libdav1d \
            --enable-videotoolbox --enable-audiotoolbox \
            --enable-securetransport
          grep -q "CONFIG_HTTPS_PROTOCOL 1" config_components.h
          make -j"$(sysctl -n hw.ncpu)"
          make install
          cp COPYING.LGPLv2.1 "$HOME/ffmpeg/LICENSE.txt"

      - name: Compilar rtv
        run: |
          export FFMPEG_DIR="$HOME/ffmpeg"
          cargo build --release --locked

      - name: Empaquetar (dylibs con @executable_path + firma ad-hoc)
        id: pkg
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then ver="$GITHUB_REF_NAME"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then ver="${{ inputs.release_tag }}"
          else ver="${GITHUB_SHA::7}"; fi
          pkg="rtv-${ver}-macos-${{ matrix.arch }}"
          mkdir -p "dist/$pkg/libs"
          cp target/release/rtv "dist/$pkg/"
          # dylibbundler copia las dylibs (ffmpeg + dav1d, recursivo), reescribe
          # los install names a @executable_path/libs/ y arregla las refs entre
          # dylibs. Las frameworks del sistema (VideoToolbox...) no se tocan.
          dylibbundler -od -b \
            -x "dist/$pkg/rtv" \
            -d "dist/$pkg/libs" \
            -p '@executable_path/libs/' \
            -s "$HOME/ffmpeg/lib" \
            -s "$(brew --prefix)/lib"
          # Re-firmar (install_name_tool invalida la firma; en arm64 un binario
          # sin firma válida ni siquiera arranca).
          codesign --force --sign - "dist/$pkg/libs/"*.dylib "dist/$pkg/rtv"
          # Verificación: ninguna referencia a rutas de build/homebrew.
          otool -L "dist/$pkg/rtv" | tee /tmp/otool.txt
          ! grep -Eq "$HOME/ffmpeg|/opt/homebrew|/usr/local/(opt|Cellar)" /tmp/otool.txt
          for dylib in "dist/$pkg/libs/"*.dylib; do
            otool -L "$dylib" | grep -Eq "$HOME/ffmpeg|/opt/homebrew|/usr/local/(opt|Cellar)" && exit 1 || true
          done
          cp "$HOME/ffmpeg/LICENSE.txt" "dist/$pkg/LICENSE-ffmpeg.txt"
          cp README.md "dist/$pkg/"
          # yt-dlp_macos oficial (universal2): fallback si no hay uno en
          # el PATH; se auto-actualiza con `yt-dlp -U`.
          curl -fsSL --retry 5 --retry-all-errors -o "dist/$pkg/yt-dlp" \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
          chmod +x "dist/$pkg/yt-dlp"
          "dist/$pkg/yt-dlp" --version   # sanity en la arch del runner
          cp ci/LICENSE-yt-dlp.txt "dist/$pkg/"
          tar -C dist -czf "$pkg.tar.gz" "$pkg"
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"

      - name: Smoke test (paquete relocable)
        run: |
          set -euo pipefail
          pkg="${{ steps.pkg.outputs.pkg }}"
          cp -R "dist/$pkg" "$TMPDIR/smoke-pkg"
          # En macOS las dylibs se cargan al arrancar el proceso: si --version
          # funciona desde otra ruta, la relocación @executable_path es correcta.
          "$TMPDIR/smoke-pkg/rtv" --version

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.pkg }}
          path: ${{ steps.pkg.outputs.pkg }}.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------ Termux (Android) --
  # Build y tests dentro de contenedores termux/termux-docker: un userland
  # Termux REAL (bionic libc, prefix /data/data/com.termux/files/usr, pkg),
  # la misma plataforma que un móvil salvo los componentes Android ausentes
  # (DalvikVM, AAudio — justo por eso rtv usa PulseAudio allí). No hace
  # falta ningún dispositivo físico para validar nada.
  termux:
    name: termux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-22.04-arm   # contenedor aarch64 NATIVO (sin qemu)
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # HOME del usuario termux dentro del contenedor.
      TXH: /data/data/com.termux/files/home
    steps:
      - uses: actions/checkout@v7

      # FFmpeg 7.1.5 compilado DENTRO del contenedor, cacheado entre runs
      # (la clave incluye el script por si cambia la receta).
      - name: Cache FFmpeg (Termux)
        id: ffcache
        uses: actions/cache@v6
        with:
          path: ffcache
          key: ffmpeg-termux-${{ matrix.arch }}-${{ env.FF_SRC_VERSION }}-${{ hashFiles('scripts/build-termux.sh') }}

      - name: Arrancar contenedor Termux
        run: |
          # seccomp unconfined: los contenedores termux (sobre todo arm)
          # necesitan syscalls que el perfil default de Docker bloquea
          # (personality — ver README de termux-docker).
          docker run -d --name tx --security-opt seccomp=unconfined \
            termux/termux-docker:${{ matrix.arch }} sleep infinity
          docker exec -u 1000 tx uname -m

      - name: Copiar repo (+ caché FFmpeg) al contenedor
        run: |
          docker cp . tx:$TXH/rtv
          if [ -d ffcache/rtv-ffmpeg ]; then
            docker cp ffcache/rtv-ffmpeg tx:$TXH/rtv-ffmpeg
          fi
          # El COPY del runner llega como root; el usuario termux es 1000.
          docker exec -u 0 tx chown -R 1000:1000 $TXH

      - name: Build nativo (scripts/build-termux.sh — el MISMO del usuario)
        run: |
          docker exec -u 1000 -e HOME=$TXH -w $TXH/rtv tx \
            bash scripts/build-termux.sh

      - name: Exportar FFmpeg al caché
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ffcache
          docker cp tx:$TXH/rtv-ffmpeg ffcache/rtv-ffmpeg

      - name: Fixtures + deps de test (python, ffmpeg CLI, pulseaudio)
        run: |
          # ffmpeg de los repos Termux (8.x): SOLO como fixture de test.
          # No interfiere con el 7.1 empaquetado (sonames distintos y el
          # wrapper rtv antepone su propio LD_LIBRARY_PATH).
          docker exec -u 1000 -e HOME=$TXH tx pkg install -y python ffmpeg pulseaudio
          # Vídeo sin audio (smoke) y con audio (test del backend pulse).
          docker exec -u 1000 -e HOME=$TXH tx sh -c \
            'ffmpeg -y -loglevel error -f lavfi -i testsrc2=size=320x180:rate=30 -t 2 -c:v mpeg4 -an $HOME/smoke.mp4'
          docker exec -u 1000 -e HOME=$TXH tx sh -c \
            'ffmpeg -y -loglevel error -f lavfi -i testsrc2=size=320x180:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 6 -c:v mpeg4 -c:a aac -shortest $HOME/smoke_audio.mp4'

      - name: Smoke test (pty real, --no-audio)
        run: |
          docker exec -u 1000 -e HOME=$TXH -w $TXH/rtv tx \
            python3 ci/smoke_pty.py /data/data/com.termux/files/usr/bin/rtv $TXH/smoke.mp4

      - name: Smoke test de RED (http local dentro del userland Termux)
        run: |
          # Valida la pila de red de libavformat (open→demux→decode) en
          # bionic. La capa TLS quedó verificada en config.h del build.
          docker exec -d -u 1000 -e HOME=$TXH tx \
            python3 -m http.server 8123 --bind 127.0.0.1 --directory $TXH
          sleep 2
          docker exec -u 1000 -e HOME=$TXH tx \
            rtv --info http://127.0.0.1:8123/smoke.mp4
          docker exec -u 1000 -e HOME=$TXH -w $TXH/rtv tx \
            python3 ci/smoke_pty.py /data/data/com.termux/files/usr/bin/rtv http://127.0.0.1:8123/smoke.mp4

      - name: Test de AUDIO real (PulseAudio null-sink, backend pulse)
        run: |
          # PulseAudio 17 (el mismo paquete que instala un usuario Termux)
          # con null-sink: no hay hardware de audio en el contenedor, pero
          # el SERVIDOR y el protocolo son 100% reales — pa_simple_new,
          # write con pacing, get_latency... todo el camino de rtv.
          # Protocolo TCP loopback (receta estándar de Termux): el socket
          # unix por defecto vive en un runtime-dir por-sesión que NO se
          # comparte de forma fiable entre distintos `docker exec`.
          docker exec -u 1000 -e HOME=$TXH tx sh -c \
            'pulseaudio --start --exit-idle-time=-1 --load="module-native-protocol-tcp auth-ip-acl=127.0.0.1 auth-anonymous=1" \
             && PULSE_SERVER=127.0.0.1 pactl load-module module-null-sink sink_name=ci_sink \
             && PULSE_SERVER=127.0.0.1 pactl info | head -3'
          # Backend explícito pulse: exige >=20 writes del feeder, reloj
          # de audio llegando a >=1 s y monotonía >=95% (audio REAL
          # anclando el master clock, no solo "no crashea").
          docker exec -u 1000 -e HOME=$TXH -e PULSE_SERVER=127.0.0.1 -w $TXH/rtv tx \
            python3 ci/termux_audio_check.py /data/data/com.termux/files/usr/bin/rtv $TXH/smoke_audio.mp4 --audio-backend pulse
          # `auto` DENTRO de Termux debe elegir pulse él solo (la
          # detección va por TERMUX_VERSION/PREFIX).
          docker exec -u 1000 -e HOME=$TXH -e PULSE_SERVER=127.0.0.1 -e TERMUX_VERSION=docker -w $TXH/rtv tx \
            python3 ci/termux_audio_check.py /data/data/com.termux/files/usr/bin/rtv $TXH/smoke_audio.mp4

      - name: CLI --audio-backend (none + valor inválido)
        run: |
          # none: reproduce sin audio y sale limpio.
          docker exec -u 1000 -e HOME=$TXH -w $TXH/rtv tx sh -c \
            'python3 ci/smoke_pty.py /data/data/com.termux/files/usr/bin/rtv $HOME/smoke.mp4 --audio-backend none'
          # inválido: exit 2 con mensaje visible.
          set +e
          docker exec -u 1000 -e HOME=$TXH tx rtv --audio-backend patata $TXH/smoke.mp4
          code=$?
          set -e
          if [ "$code" != "2" ]; then
            echo "esperaba exit 2, obtuve $code"; exit 1
          fi

      - name: Empaquetar (rtv + cierre COMPLETO de libs, autocontenido)
        id: pkg
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then ver="$GITHUB_REF_NAME"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then ver="${{ inputs.release_tag }}"
          else ver="${GITHUB_SHA::7}"; fi
          P=rtv-${ver}-termux-${{ matrix.arch }}
          mkdir -p "$P"
          docker cp tx:$TXH/rtv/target/release/rtv "$P/rtv.bin"
          # Cierre TRANSITIVO de dependencias calculado DENTRO del userland
          # Termux: FFmpeg propio + todo lo que venga de $PREFIX/lib (p.ej.
          # libdav1d del pkg — antes NO se empaquetaba y en un móvil sin
          # `pkg install libdav1d` el linker fallaba con "library not
          # found"). Solo quedan fuera las libs bionic de /system.
          docker exec -u 1000 -e HOME=$TXH -w $TXH/rtv tx sh -c \
            'python3 ci/termux_bundle_libs.py target/release/rtv $HOME/bundle-libs $HOME/rtv-ffmpeg/lib $PREFIX/lib'
          docker cp tx:$TXH/bundle-libs "$P/libs"
          # Sanity: las 5 familias de FFmpeg + libdav1d + libgnutls
          # (https) tienen que estar.
          for lib in libavutil libavcodec libavformat libswscale libswresample libdav1d libgnutls; do
            ls "$P/libs/$lib"*.so* >/dev/null || { echo "FALTA $lib en el paquete"; exit 1; }
          done
          docker cp tx:$TXH/rtv-ffmpeg/LICENSE.txt "$P/LICENSE-FFmpeg.txt" || true
          # Lanzador relativo: funciona desde cualquier ruta de Termux.
          cat > "$P/rtv" << 'WRAP'
          #!/data/data/com.termux/files/usr/bin/bash
          DIR="$(cd "$(dirname "$(readlink -f "$0")")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/libs:${LD_LIBRARY_PATH:-}"
          exec "$DIR/rtv.bin" "$@"
          WRAP
          chmod +x "$P/rtv" "$P/rtv.bin"
          cat > "$P/README.txt" << 'DOC'
          rtv para Termux (Android)
          =========================
          1. Copia esta carpeta a tu $HOME de Termux y (opcional) enlaza:
               ln -sf "$PWD/rtv" $PREFIX/bin/rtv
          2. Audio: pkg install pulseaudio
                    pulseaudio --start --exit-idle-time=-1
          3. Reproduce: rtv video.mp4
          4. YouTube y demás sitios (no hay build de yt-dlp para Android):
               pkg install python-pip && pip install yt-dlp
             y después: rtv "https://www.youtube.com/watch?v=..."
          Requiere Termux de F-Droid (no la build abandonada de Play Store).
          DOC
          tar -czf "$P.tar.gz" "$P"
          echo "pkg=$P" >> "$GITHUB_OUTPUT"

      # Reproduce EXACTAMENTE la situación de un usuario: contenedor Termux
      # RECIÉN creado (sin las deps que instaló el build: ni libdav1d, ni
      # rust, ni pulseaudio) al que solo se copia el tar.gz de la release.
      # Si al paquete le falta cualquier librería, `rtv --version` revienta
      # aquí con "library ... not found" ANTES de publicar nada.
      - name: Test de instalación LIMPIA (contenedor sin deps de build)
        run: |
          set -euo pipefail
          P="${{ steps.pkg.outputs.pkg }}"
          docker run -d --name clean --security-opt seccomp=unconfined \
            termux/termux-docker:${{ matrix.arch }} sleep infinity
          docker cp "$P.tar.gz" clean:$TXH/
          # Fixture generado en el contenedor de build (instalar ffmpeg aquí
          # arrastraría libdav1d y enmascararía justo lo que testeamos).
          docker cp tx:$TXH/smoke.mp4 /tmp/smoke.mp4
          docker cp /tmp/smoke.mp4 clean:$TXH/smoke.mp4
          docker cp ci/smoke_pty.py clean:$TXH/smoke_pty.py
          docker exec -u 0 clean chown -R 1000:1000 $TXH
          docker exec -u 1000 -e HOME=$TXH -w $TXH clean sh -c "tar -xzf $P.tar.gz"
          # 1) El linker carga TODAS las NEEDED al arrancar: si falta una
          #    lib, esto falla ya (el bug del dispositivo real).
          docker exec -u 1000 -e HOME=$TXH clean $TXH/$P/rtv --version
          # 2) Reproducción real en pty. Solo se instala python (no trae
          #    libs multimedia). Sin pulseaudio: `auto` debe degradar
          #    limpio a vídeo sin audio, como en un móvil recién instalado.
          docker exec -u 1000 -e HOME=$TXH clean pkg install -y python
          docker exec -u 1000 -e HOME=$TXH -w $TXH clean \
            python3 smoke_pty.py $TXH/$P/rtv smoke.mp4
          docker rm -f clean

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.pkg }}
          path: ${{ steps.pkg.outputs.pkg }}.tar.gz
          if-no-files-found: error

  # -------------------------------------------------------------- Release --
  # Se crea release en dos casos:
  #   * push de un tag v* (como siempre), o
  #   * Run workflow manual CON el input release_tag relleno (crea el tag).
  # El input release_message (Markdown) va encima de la tabla de descargas.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [linux, windows, macos, termux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Componer cuerpo de la release (mensaje Markdown + tabla)
        env:
          MSG: ${{ inputs.release_message }}
        run: |
          set -euo pipefail
          {
            if [ -n "$MSG" ]; then
              # El campo del formulario es de una línea: los "\n" literales
              # se convierten en saltos reales para poder escribir listas,
              # párrafos, etc. El resto pasa TAL CUAL (Markdown soportado).
              printf '%s\n' "$MSG" | sed 's/\\n/\n/g'
              printf '\n---\n\n'
            fi
            cat << 'TABLE'
          Binarios autocontenidos: **FFmpeg 7.1 va incluido dentro de cada
          paquete** — no hay que instalar nada más. Los paquetes de
          Linux/Windows/macOS incluyen además **yt-dlp** (para reproducir
          URLs de YouTube y demás: `rtv <url>`); rtv usará el del PATH si
          tienes uno más nuevo, y el incluido se actualiza con `yt-dlp -U`.
          En Termux no hay build de yt-dlp para Android: `pip install yt-dlp`.

          | Plataforma | Fichero | Requisitos |
          |---|---|---|
          | Linux x86_64 | `rtv-*-linux-x86_64.tar.gz` | glibc ≥ 2.35 (Ubuntu 22.04+), libasound2 |
          | Linux arm64 | `rtv-*-linux-arm64.tar.gz` | glibc ≥ 2.35 (Ubuntu 22.04+), libasound2 |
          | Windows x86_64 | `rtv-*-windows-x86_64.zip` | Windows 10+ |
          | macOS Intel | `rtv-*-macos-x86_64.tar.gz` | macOS 13+ |
          | macOS Apple Silicon | `rtv-*-macos-arm64.tar.gz` | macOS 14+ |
          | Termux/Android aarch64 | `rtv-*-termux-aarch64.tar.gz` | Termux de F-Droid; audio: `pkg install pulseaudio` |
          | Termux/Android x86_64 | `rtv-*-termux-x86_64.tar.gz` | (emuladores/Android-x86) |

          Uso: descomprimir y ejecutar `./rtv vídeo.mp4` (Windows: `rtv.exe vídeo.mp4`).
          El binario debe permanecer junto a su carpeta `lib/`/`libs/` (Linux/macOS/Termux)
          o junto a las DLLs (Windows).
          TABLE
          } > release_body.md
          echo "---- cuerpo generado ----"; cat release_body.md

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          body_path: release_body.md
          # En dispatch manual no hay tag en el ref: se usa el input y el
          # tag se crea sobre el commit exacto que compiló los artefactos.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease || false }}
