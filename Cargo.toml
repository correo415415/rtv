[package]
name = "rtv"
version = "0.2.0"
edition = "2021"
description = "rtv — reproductor de vídeo de terminal ultra-rápido (Rust)"
license = "MIT"

[dependencies]
# --- Decodificación de vídeo y audio ---
# ffmpeg-the-third 5.0 con FFmpeg 7.1 (ver BUILD-WINDOWS.md — importante).
ffmpeg-the-third = { version = "5.0", default-features = false, features = [
    "codec",
    "format",
    "software-scaling",
    "software-resampling",
] }

# --- Terminal y eventos ---
crossterm = { version = "0.29", features = ["event-stream"] }

# --- Audio ---
# cpal: acceso cross-platform a WASAPI (Win), ALSA/PulseAudio (Linux),
# CoreAudio (Mac). OPCIONAL: en Termux/Android no compila (su backend
# AAudio/oboe requiere el NDK y un contexto de app) — allí se usa el
# backend `pulse` (ver abajo).
cpal = { version = "0.15", optional = true }

# libloading: dlopen de libpulse-simple en runtime para el backend
# PulseAudio (Termux y fallback en Linux). Sin dependencia de build
# contra libpulse: si la lib no está en el sistema se degrada limpio.
libloading = { version = "0.8", optional = true }

# --- Concurrencia ---
crossbeam-channel = "0.5"
parking_lot = "0.12"

# --- Utilidades ---
anyhow = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
once_cell = "1"
# Anchura REAL en celdas de cada carácter (wide/emoji) — el HUD se
# truncaba contando 1 celda/char y con caracteres de anchura 2 la
# línea desbordaba `cols` → autowrap → scroll → basura visual.
unicode-width = "0.2"

# --- Allocator rápido ---
mimalloc = { version = "0.1", default-features = false }

[features]
# Ambos backends de audio por defecto: cpal (WASAPI/ALSA/CoreAudio) y
# pulse (PulseAudio vía dlopen — coste cero si no hay servidor).
# Termux/Android: compilar con `--no-default-features --features pulse`.
default = ["cpal-audio", "pulse"]
cpal-audio = ["dep:cpal"]
pulse = ["dep:libloading"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false

[profile.dev]
opt-level = 1
