[package]
name = "rtv"
version = "0.2.0"
edition = "2021"
description = "rtv — reproductor de vídeo de terminal ultra-rápido (Rust)"
license = "MIT"

[dependencies]
# --- Decodificación de vídeo y audio ---
# ffmpeg-the-third 5.0 con FFmpeg 7.1 (ver BUILD-WINDOWS.md — importante).
ffmpeg-the-third = { version = "5.0", default-features = false, features = [
    "codec",
    "format",
    "software-scaling",
    "software-resampling",
] }

# --- Terminal y eventos ---
crossterm = { version = "0.29", features = ["event-stream"] }

# --- Audio ---
# cpal: acceso cross-platform a WASAPI (Win), ALSA/PulseAudio (Linux), CoreAudio (Mac).
cpal = "0.15"

# --- Concurrencia ---
crossbeam-channel = "0.5"
parking_lot = "0.12"

# --- Utilidades ---
anyhow = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
once_cell = "1"
# Anchura REAL en celdas de cada carácter (wide/emoji) — el HUD se
# truncaba contando 1 celda/char y con caracteres de anchura 2 la
# línea desbordaba `cols` → autowrap → scroll → basura visual.
unicode-width = "0.2"

# --- Allocator rápido ---
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false

[profile.dev]
opt-level = 1
